<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notion RAG 검색</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        
        input {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            padding: 15px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #5568d3;
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .chat-container {
            height: 500px;
            overflow-y: auto;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .message {
            margin-bottom: 20px;
            animation: fadeIn 0.3s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.user {
            text-align: right;
        }
        
        .message.assistant {
            text-align: left;
        }
        
        .message-content {
            display: inline-block;
            max-width: 70%;
            padding: 15px 20px;
            border-radius: 15px;
            text-align: left;
        }
        
        .message.user .message-content {
            background: #667eea;
            color: white;
        }
        
        .message.assistant .message-content {
            background: white;
            color: #333;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .sources {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #e0e0e0;
            font-size: 12px;
            color: #666;
        }
        
        .source-item {
            margin: 5px 0;
        }
        
        .result {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
        
        .answer {
            line-height: 1.8;
            color: #333;
            margin-bottom: 20px;
            white-space: pre-wrap;
        }
        
        .source-item {
            background: white;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 5px;
            font-size: 14px;
        }
        
        .loading {
            text-align: center;
            color: #667eea;
            font-size: 18px;
        }
        
        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }
        
        .session-info {
            text-align: center;
            margin-bottom: 20px;
            color: #666;
            font-size: 14px;
        }
        
        .clear-btn {
            background: #ff6b6b;
            padding: 8px 16px;
            font-size: 14px;
            margin-left: 10px;
        }
        
        .clear-btn:hover {
            background: #ee5a52;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Notion RAG 검색</h1>
        
        <div class="session-info">
            <span id="sessionStatus">새로운 대화</span>
            <button class="clear-btn" onclick="clearSession()" id="clearBtn" style="display:none;">대화 초기화</button>
        </div>
        
        <div class="chat-container" id="chatContainer">
            <div class="empty-state">
                <div class="empty-state-icon">💬</div>
                <div>질문을 입력하면 대화가 시작됩니다</div>
            </div>
        </div>
        
        <div class="search-box">
            <input 
                type="text" 
                id="question" 
                placeholder="질문을 입력하세요..."
                onkeypress="if(event.key==='Enter') search()"
            >
            <button onclick="search()" id="searchBtn">전송</button>
        </div>
    </div>
    
    <script>
        const API_URL = 'http://localhost:8000';
        let sessionId = null;
        
        function updateSessionStatus() {
            const statusEl = document.getElementById('sessionStatus');
            const clearBtn = document.getElementById('clearBtn');
            
            if (sessionId) {
                statusEl.textContent = '💬 대화 진행 중';
                clearBtn.style.display = 'inline-block';
            } else {
                statusEl.textContent = '새로운 대화';
                clearBtn.style.display = 'none';
            }
        }
        
        function scrollToBottom() {
            const chatContainer = document.getElementById('chatContainer');
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        
        function addMessage(role, content, sources = null) {
            const chatContainer = document.getElementById('chatContainer');
            
            // 첫 메시지면 empty state 제거
            const emptyState = chatContainer.querySelector('.empty-state');
            if (emptyState) {
                emptyState.remove();
            }
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            let sourcesHtml = '';
            if (sources && sources.length > 0) {
                sourcesHtml = `
                    <div class="sources">
                        📄 참고: ${sources.map(s => s.title).join(', ')}
                    </div>
                `;
            }
            
            messageDiv.innerHTML = `
                <div class="message-content">
                    ${content}
                    ${sourcesHtml}
                </div>
            `;
            
            chatContainer.appendChild(messageDiv);
            scrollToBottom();
        }
        
        function showLoading() {
            const chatContainer = document.getElementById('chatContainer');
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message assistant';
            loadingDiv.id = 'loading-message';
            loadingDiv.innerHTML = `
                <div class="message-content">
                    <div class="loading">💭 답변 생각중...</div>
                </div>
            `;
            chatContainer.appendChild(loadingDiv);
            scrollToBottom();
        }
        
        function removeLoading() {
            const loadingMsg = document.getElementById('loading-message');
            if (loadingMsg) {
                loadingMsg.remove();
            }
        }
        
        async function clearSession() {
            if (!sessionId) return;
            
            if (!confirm('대화 기록을 초기화하시겠습니까?')) return;
            
            try {
                await fetch(`${API_URL}/session/${sessionId}`, {
                    method: 'DELETE'
                });
                
                sessionId = null;
                updateSessionStatus();
                
                // 채팅 화면 초기화
                const chatContainer = document.getElementById('chatContainer');
                chatContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">💬</div>
                        <div>질문을 입력하면 대화가 시작됩니다</div>
                    </div>
                `;
            } catch (error) {
                alert('초기화 실패: ' + error.message);
            }
        }
        
        async function search() {
            const questionInput = document.getElementById('question');
            const question = questionInput.value.trim();
            const searchBtn = document.getElementById('searchBtn');
            
            if (!question) {
                alert('질문을 입력해주세요');
                return;
            }
            
            // 사용자 메시지 추가
            addMessage('user', question);
            
            // 입력창 초기화
            questionInput.value = '';
            
            searchBtn.disabled = true;
            showLoading();
            
            try {
                const response = await fetch(`${API_URL}/query`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        question,
                        session_id: sessionId
                    })
                });
                
                if (!response.ok) {
                    throw new Error('검색 실패');
                }
                
                const data = await response.json();
                
                // 세션 ID 저장
                if (data.session_id) {
                    sessionId = data.session_id;
                    updateSessionStatus();
                }
                
                removeLoading();
                
                // AI 답변 추가
                addMessage('assistant', data.answer, data.sources);
                
            } catch (error) {
                removeLoading();
                addMessage('assistant', `❌ 오류: ${error.message}`);
            } finally {
                searchBtn.disabled = false;
                questionInput.focus();
            }
        }
    </script>
</body>
</html>
