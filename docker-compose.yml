services:
  api:
    build: .
    command: python api.py
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./index.html:/app/index.html
    restart: unless-stopped

  scheduler:
    build: .
    command: python scheduler.py
    env_file:
      - .env
    volumes:
      - ./chroma_db:/app/chroma_db
    restart: unless-stopped
    depends_on:
      - api
